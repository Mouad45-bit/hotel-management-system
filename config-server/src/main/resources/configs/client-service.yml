server:
  port: ${CLIENT_SERVICE_PORT:8083}

spring:
  application:
    name: client-service

  datasource:
    url: jdbc:mariadb://${CLIENT_DB_HOST:localhost}:${CLIENT_DB_PORT:3309}/${CLIENT_DB_NAME:db_client}
    username: ${CLIENT_DB_USER:hotel_user}
    password: ${CLIENT_DB_PASSWORD:hotel_pass}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
