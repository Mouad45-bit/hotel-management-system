server:
  port: ${STAFF_SERVICE_PORT:8087}

spring:
  application:
    name: staff-service

  datasource:
    url: jdbc:mariadb://${STAFF_DB_HOST:localhost}:${STAFF_DB_PORT:3313}/${STAFF_DB_NAME:db_staff}
    username: ${STAFF_DB_USER:hotel_user}
    password: ${STAFF_DB_PASSWORD:hotel_pass}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
