server:
  port: ${INVOICE_SERVICE_PORT:8085}

spring:
  application:
    name: invoice-service

  datasource:
    url: jdbc:mariadb://${INVOICE_DB_HOST:localhost}:${INVOICE_DB_PORT:3309}/${INVOICE_DB_NAME:db_invoice}
    username: ${INVOICE_DB_USER:hotel_user}
    password: ${INVOICE_DB_PASSWORD:hotel_pass}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
