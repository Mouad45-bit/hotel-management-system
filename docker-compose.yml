name: hotel-management-system

services:
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    environment:
      CONFIG_SERVER_PORT: 8888
    ports:
      - "8888:8888"
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      EUREKA_SERVER_PORT: 8761
    ports:
      - "8761:8761"
    networks:
      - hotel-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  db-auth:
    image: mariadb:11.4
    container_name: db-auth
    ports:
      - "3307:3306"
    networks:
      - hotel-network
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_hotel}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-db_auth}
      MARIADB_USER: ${MYSQL_USER:-hotel_user}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-hotel_pass}
    volumes:
      - db-auth-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-room:
    image: mariadb:11.4
    container_name: db-room
    ports:
      - "3308:3306"
    networks:
      - hotel-network
    environment:
      MARIADB_ROOT_PASSWORD: ${ROOM_DB_ROOT_PASSWORD:-root_hotel}
      MARIADB_DATABASE: ${ROOM_DB_NAME:-db_room}
      MARIADB_USER: ${ROOM_DB_USER:-hotel_user}
      MARIADB_PASSWORD: ${ROOM_DB_PASSWORD:-hotel_pass}
    volumes:
      - db-room-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db-invoice:
    image: mariadb:11.4
    container_name: db-invoice
    ports:
      - "3309:3306"
    networks:
      - hotel-network
    environment:
      MARIADB_ROOT_PASSWORD: ${INVOICE_DB_ROOT_PASSWORD:-root_hotel}
      MARIADB_DATABASE: ${INVOICE_DB_NAME:-db_invoice}
      MARIADB_USER: ${INVOICE_DB_USER:-hotel_user}
      MARIADB_PASSWORD: ${INVOICE_DB_PASSWORD:-hotel_pass}
    volumes:
      - db-invoice-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD} --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  room-service:
    build:
      context: ./room-service
      dockerfile: Dockerfile
      args:
        SERVICE_PORT: 8082
    container_name: room-service
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      EUREKA_DEFAULT_ZONE: "http://eureka-server:8761/eureka/"
      ROOM_SERVICE_PORT: 8082
      ROOM_DB_HOST: db-room
      ROOM_DB_PORT: 3306
      ROOM_DB_NAME: db_room
      ROOM_DB_USER: hotel_user
      ROOM_DB_PASSWORD: hotel_pass
    ports:
      - "8082:8082"
    networks:
      - hotel-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-room:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 50s
    restart: unless-stopped

  invoice-service:
    build:
      context: ./invoice-service
      dockerfile: Dockerfile
      args:
        SERVICE_PORT: 8085
    container_name: invoice-service
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      EUREKA_DEFAULT_ZONE: "http://eureka-server:8761/eureka/"
      INVOICE_SERVICE_PORT: 8085
      INVOICE_DB_HOST: db-invoice
      INVOICE_DB_PORT: 3306
      INVOICE_DB_NAME: db_invoice
      INVOICE_DB_USER: hotel_user
      INVOICE_DB_PASSWORD: hotel_pass
    ports:
      - "8085:8085"
    networks:
      - hotel-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-invoice:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 50s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      EUREKA_DEFAULT_ZONE: "http://eureka-server:8761/eureka/"
      API_GATEWAY_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - hotel-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 50s
    restart: unless-stopped

networks:
  hotel-network:
    name: hotel-network
    driver: bridge

volumes:
  db-auth-data:
    name: db-auth-data
  db-room-data:
    name: db-room-data
  db-invoice-data:
    name: db-invoice-data
